<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft Clicker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#181818;color:#fff;font-family:Arial,sans-serif}
#app{max-width:1150px;margin:auto;padding:18px}.game{display:grid;grid-template-columns:1fr 360px;gap:16px}
.panel{background:#292929;border:2px solid #505050;border-radius:12px;padding:16px}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
.stat{font-size:24px;font-weight:800}.muted{color:#aaa;font-size:13px}
.stage{text-align:center;min-height:470px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.block{width:210px;height:210px;border:8px solid #555;border-radius:8px;box-shadow:inset 0 0 0 4px #ffffff18,8px 10px 0 #0005;cursor:pointer}
.block:active{transform:scale(.94)}
.grass{background:linear-gradient(#4eaf3e 0 23%,#80512e 23%)}.stone{background:radial-gradient(circle at 25% 30%,#aaa 0 7%,transparent 8%),radial-gradient(circle at 70% 65%,#666 0 8%,transparent 9%),#858585}
.coal{background:radial-gradient(circle,#222 0 11%,transparent 12%),#858585}.iron{background:radial-gradient(circle,#d7b39d 0 10%,transparent 11%),#858585}.copper{background:radial-gradient(circle,#d77b45 0 11%,transparent 12%),#858585}
.gold{background:radial-gradient(circle,#ffe35b 0 11%,transparent 12%),#a86f15}.redstone{background:radial-gradient(circle,#e22b25 0 10%,transparent 11%),#7b7777}
.lapis{background:radial-gradient(circle,#254dce 0 11%,transparent 12%),#777}.diamond{background:radial-gradient(circle,#63e9ed 0 11%,transparent 12%),#347b82}
.emerald{background:radial-gradient(circle,#28d46c 0 11%,transparent 12%),#777}.quartz{background:radial-gradient(circle,#fff1df 0 10%,transparent 11%),#c9b8a8}
.amethyst{background:radial-gradient(circle,#b56cff 0 11%,transparent 12%),#66506e}.ancient{background:radial-gradient(circle,#a85b48 0 11%,transparent 12%),#53423b}
.obsidian{background:radial-gradient(circle at 30% 30%,#735496 0 8%,transparent 9%),#241a31}.netherite{background:radial-gradient(circle,#74665d 0 10%,transparent 11%),#292522}
.cake{background:linear-gradient(#fff1c7 0 20%,#cf8957 20% 72%,#fff1c7 72% 84%,#9c5038 84%)}.berry{background:radial-gradient(circle at 30% 35%,#5b5be5 0 9%,transparent 10%),radial-gradient(circle at 65% 55%,#e85aa0 0 10%,transparent 11%),linear-gradient(#fff1c7 0 20%,#cf8957 20% 72%,#fff1c7 72% 84%,#9c5038 84%)}
.toolbox{background:#222;border:1px solid #555;border-radius:10px;padding:12px;margin-bottom:12px}.tool-title{font-weight:800;font-size:18px}.tool-desc{font-size:13px;color:#aaa;margin-top:3px}
.upgrade{width:100%;padding:12px;margin-top:9px;text-align:left;border:1px solid #555;border-radius:9px;background:#383838;color:#fff;cursor:pointer}.upgrade:hover{background:#444}.upgrade:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:360px;overflow:auto}.item{padding:9px;border:1px solid #555;border-radius:8px;background:#333;color:#fff;text-align:left;cursor:pointer}.item.active{border-color:#9bd45c}.item:disabled{opacity:.42;cursor:not-allowed}
.mini{display:inline-block;width:32px;height:32px;border-width:2px;vertical-align:middle;margin-right:6px}
.notice{font-size:12px;color:#aaa;margin-top:10px}
@media(max-width:720px){.game{grid-template-columns:1fr}.stage{min-height:390px}.block{width:160px;height:160px}}
</style>
</head>
<body><div id="app"><div class="game">
<section class="panel">
<div class="top"><div><div class="stat">⛏ <span id="coins">0</span> добычи</div><div class="muted">Кликай по блоку и проходи уровни кирок</div></div><div><div class="stat">⚡ <span id="power">1</span>/клик</div><div class="muted">Авто: <span id="auto">0</span>/сек</div></div></div>
<div class="stage"><button id="main" class="block grass" aria-label="Добыть блок"></button><h2 id="name">Картошка</h2><div class="muted"><span id="tool">Картошка</span> · уровень <span id="level">1</span> · добыто <span id="owned">0</span></div></div>
</section>
<aside class="panel">
<div class="toolbox"><div class="tool-title">Текущий инструмент: <span id="tool2">Картошка</span></div><div class="tool-desc" id="toolDesc">Самый первый инструмент</div></div>
<h2>Улучшения</h2>
<button id="powerBtn" class="upgrade">⛏ Улучшить инструмент<br><span class="muted">+1 сила · цена <b id="powerCost">10</b></span></button>
<button id="autoBtn" class="upgrade">⚙ Автоматическая добыча<br><span class="muted">+1 блок/сек · цена <b id="autoCost">100</b></span></button>
<button id="nextBtn" class="upgrade">🔓 Следующий инструмент<br><span class="muted">цена <b id="toolCost">50</b></span></button>
<h2>Все руды и блоки</h2><div id="items" class="grid"></div>
<div class="notice">Руды разделены по типам: Overworld, Nether и редкие ресурсы. Торты тоже можно открывать.</div>
</aside></div></div>
<script>
const tools=[
['Картошка','Самый первый инструмент',1,1],['Деревянная кирка','Обычная деревянная кирка',2,1],['Улучшенная деревянная кирка','Та же палка, но усиленная',4,2],['Каменная кирка','Каменный уровень',7,3],['Улучшенная каменная кирка','Усиленная версия каменной',11,4],
['Железная кирка','Железный уровень',18,5],['Улучшенная железная кирка','Вторая железная версия',28,6],['Золотая кирка','Золотой уровень',45,7],['Улучшенная золотая кирка','Усиленная золотая версия',65,8],['Алмазная кирка','Алмазный уровень',95,9],['Улучшенная алмазная кирка','Вторая алмазная версия',140,10],
['Обсидиановая кирка','Обсидиановая палка, автоматическая добыча',220,11],['Улучшенная обсидиановая кирка','Третья обсидиановая версия',330,12],['Мозеритовая кирка','Финальный сверхпрочный уровень',500,13],['Улучшенная мозеритовая кирка','Финальная улучшенная версия',800,14],['Незеритовая кирка','Максимальный уровень',1200,15]
];
const blocks=[
['Угольная руда','coal',2],['Глубинная угольная руда','coal',3],['Железная руда','iron',4],['Глубинная железная руда','iron',6],['Медная руда','copper',7],['Глубинная медная руда','copper',9],
['Золотая руда','gold',12],['Глубинная золотая руда','gold',16],['Редстоуновая руда','redstone',20],['Глубинная редстоуновая руда','redstone',28],['Лазуритовая руда','lapis',25],['Глубинная лазуритовая руда','lapis',35],
['Алмазная руда','diamond',45],['Глубинная алмазная руда','diamond',65],['Изумрудная руда','emerald',70],['Глубинная изумрудная руда','emerald',100],['Аметистовый блок','amethyst',130],
['Кварцевая руда Нижнего мира','quartz',150],['Древние обломки','ancient',220],['Незеритовый блок','netherite',450],['Обсидиан','obsidian',300],
['Камень','stone',1],['Дерево','grass',2],['Дёрн','grass',2],
['Торт','cake',35],['Клубничный торт','berry',45],['Черничный торт','berry',55],['Малиновый торт','berry',65],['Ежевичный торт','berry',75],['Вишнёвый торт','berry',85],['Сладкоягодный торт','berry',100],['Светоягодный торт','berry',120],['Дынный торт','cake',140],['Тыквенный торт','cake',160],['Торт из хорус-фрукта','berry',190]
];
let coins=0,power=1,auto=0,toolIndex=0,blockIndex=0,owned=0,powerCost=10,autoCost=100,toolCost=50;
const $=id=>document.getElementById(id),fmt=x=>Math.floor(x).toLocaleString('ru-RU');
function render(){
 const t=tools[toolIndex],b=blocks[blockIndex];
 $('coins').textContent=fmt(coins);$('power').textContent=power;$('auto').textContent=auto;$('name').textContent=b[0];$('tool').textContent=t[0];$('tool2').textContent=t[0];$('toolDesc').textContent=t[1];$('level').textContent=blockIndex+1;$('owned').textContent=owned;
 $('powerCost').textContent=fmt(powerCost);$('autoCost').textContent=fmt(autoCost);$('toolCost').textContent=fmt(toolCost);$('main').className='block '+b[1];
 $('items').innerHTML=blocks.map((x,i)=>`<button class="item ${i===blockIndex?'active':''}" ${i>toolIndex+2?'disabled':''} data-i="${i}"><span class="mini block ${x[1]}"></span><b>${x[0]}</b><div class="muted">×${x[2]}</div></button>`).join('');
 document.querySelectorAll('.item').forEach(e=>e.onclick=()=>{blockIndex=+e.dataset.i;owned=0;render()});
 $('nextBtn').disabled=toolIndex>=tools.length-1;
}
$('main').onclick=()=>{const b=blocks[blockIndex],t=tools[toolIndex];coins+=b[2]*power*t[2];owned++;if(toolIndex>=11)coins+=auto*2;render()};
$('powerBtn').onclick=()=>{if(coins>=powerCost){coins-=powerCost;power++;powerCost=Math.ceil(powerCost*1.55);render()}};
$('autoBtn').onclick=()=>{if(coins>=autoCost){coins-=autoCost;auto++;autoCost=Math.ceil(autoCost*1.75);render()}};
$('nextBtn').onclick=()=>{if(toolIndex<tools.length-1&&coins>=toolCost){coins-=toolCost;toolIndex++;power=tools[toolIndex][2];toolCost=Math.ceil(toolCost*1.7);render()}};
setInterval(()=>{if(auto){coins+=auto*blocks[blockIndex][2]*Math.max(1,tools[toolIndex][2]);render()}},1000);
render();
</script></body></html>
